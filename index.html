<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pfahlvolleyballturnier</title>
    <style>
      :root {
        --bg: #0f0b0b;
        --card: #1a1414;
        --text: #f5f5f5;
        --muted: #c9c9c9;
        --accent: #283593;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #140e0e 0%, var(--bg) 100%);
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 1rem;
      }

      .hero {
        background: linear-gradient(120deg, rgba(40,53,147,0.92), rgba(20,20,40,0.95));
        border-radius: 1rem;
        padding: 1.2rem;
        margin-bottom: 1rem;
      }

      h1, h2 { margin: 0 0 .6rem; }
      p { margin: 0 0 .5rem; color: var(--muted); }

      .meta {
        margin-top: .8rem;
      }

      .actions {
        display: flex;
        gap: .75rem;
        margin-top: 1rem;
      }

      button {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: .6rem;
        padding: .65rem .9rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <h1>Pfahlvolleyballturnier</h1>
        <p>30. Mai 2026 · 11:30–17:30 Uhr · Burgdorf, Sporthalle Lindenfeld</p>
        <div class="meta">
          <h2>Format</h2>
          <p>Mixed (mind. 2 Frauen auf dem Feld)</p>
        </div>
      </header>

      <div class="actions">
        <button type="button">Teams</button>
        <button type="button">Spielplan</button>
      </div>
    </div>
  </body>
</html>
